<rect width="660" height="400" fill="url(#bg)"/>
<text x="330" y="62" text-anchor="middle" font-family="Inter Tight" font-weight="600" font-size="26" letter-spacing="-0.5" fill="#171614">Install <tspan font-family="Instrument Serif" font-style="italic" font-weight="400" font-size="30">Omacus</tspan></text>
<text x="330" y="88" text-anchor="middle" font-family="Inter" font-size="13" fill="#7c7973">Drag the app into Applications.</text>
