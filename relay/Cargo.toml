[package]
name = "omacus-relay"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Private sync test relay. It stores sealed pages and cannot open them."

[dependencies]
base64 = "0.22"
getrandom = "0.2"
hmac = "0.13"
serde_json = "1.0.154"
sha2 = "0.11"

[dev-dependencies]
omacus-doc = { path = "../doc" }
omacus-engine = { path = "../engine" }
omacus-sync-web = { path = "../sync-web" }
