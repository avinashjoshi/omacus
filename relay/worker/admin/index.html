<!DOCTYPE html>
<html lang="en" data-app-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sync</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>
    <main class="admin">
      <h1>Sync</h1>
      <p class="lede">This page can pause new signups, mint an invite code, and remove a sealed copy. It cannot open a page.</p>

      <form class="key" data-key>
        <label>Admin key <input name="key" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Unlock</button>
      </form>
      <p class="alert" data-key-error role="alert"></p>

      <div data-app hidden>
        <section class="block">
          <p data-signups>New signups are on.</p>
          <button class="quiet" type="button" data-pause>Pause new signups</button>
        </section>

        <section class="block">
          <h2>Create a code</h2>
          <form class="create" data-create>
            <label>Label <input name="label" maxlength="40" autocomplete="off"></label>
            <label>Uses <input name="uses" type="number" min="1" max="20" value="1" required></label>
            <label>Expiry <input name="expires" type="date"> <span class="hint">Optional.</span></label>
            <button class="primary" type="submit">Create code</button>
          </form>
          <div class="once" data-once hidden></div>
        </section>

        <section class="block">
          <h2>Codes</h2>
          <div data-codes></div>
        </section>

        <section class="block">
          <h2>Stats</h2>
          <p data-counts></p>
          <h3>Storage</h3>
          <div data-storage></div>
          <h3>Recent errors</h3>
          <div data-errors></div>
        </section>

        <section class="block">
          <h2>Remove a sealed copy</h2>
          <p>Type the account id to confirm.</p>
          <form class="remove" data-remove>
            <label>Account id <input name="account" autocomplete="off" spellcheck="false" required></label>
            <button class="danger" type="submit">Remove sealed copy</button>
          </form>
          <p class="alert" data-remove-note role="status"></p>
        </section>
      </div>
    </main>
    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
