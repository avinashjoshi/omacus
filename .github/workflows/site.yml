name: Site

# Deploys site/ to GitHub Pages (omacus.com). The installer is published from the
# repo root, so omacus.com/install is always the current install.sh.
on:
  push:
    branches: [main]
    paths: ["site/**", "engine/**", "web/**", "install.sh", "install.ps1", "Cargo.toml", "Cargo.lock", ".github/workflows/site.yml"]
  workflow_dispatch:
    inputs:
      expect_version:
        description: Wait until this version is on the releases API
        required: false
        default: ""
        type: string
  # A release published by hand. The Release workflow does not emit this event;
  # it deploys the site itself and passes expect_version.
  release:
    types: [published]
  # The monthly refresh (freshen.yml) deploys through this after committing.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      expect_version:
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0  # for the site's last-modified date
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Assemble
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -rf _site/tools _site/app/pkg
          cp install.sh _site/install
          cp install.ps1 _site/install.ps1
      - name: Build the engine for the browser (omacus.com/app)
        # The desktop app's own engine, compiled to WebAssembly. The CLI version must
        # match the wasm-bindgen crate pinned in web/Cargo.toml.
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build -p omacus-web --release --locked --target wasm32-unknown-unknown
          wasm-bindgen --target web --no-typescript --out-dir _site/app/pkg \
            target/wasm32-unknown-unknown/release/omacus_web.wasm
          ls -l _site/app/pkg
      - name: Updates page
        # Static changelog from the GitHub releases API, before assets are hashed,
        # so the new page picks up the same cache-busting as the rest of the site.
        # A missing API keeps the copy already in site/updates.
        env:
          GH_TOKEN: ${{ github.token }}
          OMACUS_EXPECT_VERSION: ${{ inputs.expect_version || (github.event_name == 'release' && github.event.release.tag_name) || '' }}
        run: python3 site/tools/updates.py --out _site
      - name: Version assets
        # Cloudflare in front of omacus.com caches CSS and JS for hours, so pages point
        # at each file by its content hash and pick up a new version immediately.
        run: |
          # Screenshots, images and the video, wherever a page points at one ("/img/…"):
          # they change in place when the app's look changes.
          for f in $(cd _site && find img media updates -type f \( -name '*.webp' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' -o -name '*.mp4' \) 2>/dev/null); do
            hash=$(sha256sum "_site/$f" | cut -c1-10)
            find _site -name '*.html' -exec sed -i "s#\"/$f\"#\"/$f?v=$hash\"#g" {} +
          done
          grep -rho '"/\(img\|media\)/[^"]*?v=[0-9a-f]*"' _site | sort -u
          # Icons first: pages and site.js point into the sprite, then get hashed themselves.
          hash=$(sha256sum _site/img/sprite.svg | cut -c1-10)
          grep -rl --include='*.html' --include='*.js' '/img/sprite.svg#' _site |
            xargs sed -i "s#/img/sprite.svg\##/img/sprite.svg?v=$hash\##g"
          # The app's engine: its .wasm and JS glue, referenced from app.js and from the
          # worker that calculates (worker.js), which app.js then points at by its hash.
          for f in omacus_web_bg.wasm omacus_web.js; do
            hash=$(sha256sum "_site/app/pkg/$f" | cut -c1-10)
            sed -i "s#pkg/$f\"#pkg/$f?v=$hash\"#g" _site/app/app.js _site/app/worker.js
          done
          grep -o 'pkg/[a-z_]*\.[a-z]*?v=[0-9a-f]*' _site/app/worker.js
          hash=$(sha256sum _site/app/worker.js | cut -c1-10)
          sed -i "s#\"./worker.js\"#\"./worker.js?v=$hash\"#" _site/app/app.js
          # The editor (CodeMirror, bundled by site/tools/editor), imported by app.js.
          hash=$(sha256sum _site/app/editor.js | cut -c1-10)
          sed -i "s#\"./editor.js\"#\"./editor.js?v=$hash\"#" _site/app/app.js
          # Folder tree, imported by app.js. Hashed so a cached copy can't outlive the app.
          hash=$(sha256sum _site/app/tree.js | cut -c1-10)
          sed -i "s#\"./tree.js\"#\"./tree.js?v=$hash\"#" _site/app/app.js
          grep -o 'pkg/[a-z_]*\.[a-z]*?v=[0-9a-f]*\|editor\.js?v=[0-9a-f]*\|worker\.js?v=[0-9a-f]*\|tree\.js?v=[0-9a-f]*' _site/app/app.js
          for asset in css/site.css js/site.js js/demo-data.js app/app.css app/app.js; do
            hash=$(sha256sum "_site/$asset" | cut -c1-10)
            find _site -name '*.html' -exec sed -i "s#\"/$asset\"#\"/$asset?v=$hash\"#g" {} +
          done
          grep -rho '/[a-z]*/[a-z-]*\.\(css\|js\)?v=[0-9a-f]*' _site | sort | uniq -c
      - name: Fill in version and dates
        # Structured data and the sitemap carry the current release and the date the
        # site last changed, so search engines and AI assistants see fresh facts.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          lastmod=$(git log -1 --format=%cs -- site Cargo.toml)
          grep -rl --include='*.html' --include='*.xml' -e '{{version}}' -e '{{lastmod}}' _site |
            xargs sed -i -e "s/{{version}}/$version/g" -e "s/{{lastmod}}/$lastmod/g"
          sed -i "s/>v[0-9][0-9.]*</>v$version</" _site/index.html
          echo "version $version, last modified $lastmod"
          ! grep -rq -e '{{version}}' -e '{{lastmod}}' _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Tell search engines
        # IndexNow notifies Bing, Yandex and others (Bing also feeds ChatGPT and Copilot
        # search) that the pages changed. The key file is site/<key>.txt.
        continue-on-error: true
        run: |
          key=$(basename site/[0-9a-f]*.txt .txt)
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json' \
            -d "{\"host\":\"omacus.com\",\"key\":\"$key\",\"keyLocation\":\"https://omacus.com/$key.txt\",\"urlList\":[\"https://omacus.com/\",\"https://omacus.com/docs/\",\"https://omacus.com/updates/\",\"https://omacus.com/updates/feed.xml\",\"https://omacus.com/llms.txt\",\"https://omacus.com/llms-full.txt\"]}" \
            -w 'IndexNow: HTTP %{http_code}\n'
