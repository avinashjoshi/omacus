name: Release

# One change carries its own version bump. Run prepare-release.sh on that pull
# request (version, lockfile, web app version, and the changelog section).
# Merging it pushes the new version to main. The push below tags v<version>
# and publishes, because that version has no tag yet. Main is protected, so
# the bump still arrives through the pull request, not a direct push.
#
# Several changes already on main ship together as a release pull request.
# Run this workflow by hand with action `prepare` (Actions → Release → Run
# workflow). That runs the same script and opens a pull request that
# auto-merges once the required checks on main pass. A pull request whose
# notes are commit titles, or mention pull requests and CI, fails the
# release-notes check.
#
# After a prepare pull request merges, this same run tags `v<version>` and publishes
# the GitHub release. A push to main does the same when the merged version has no tag
# yet, which is how a one-change pull request ships. A tag or release created by
# GITHUB_TOKEN does not trigger other workflows, so the builds and the publish job
# live here. After the tag is published, this run deploys omacus.com, the web app, and the sync worker.
#
# The checks to require on main are `test (ubuntu-22.04)`, `test (windows-latest)`,
# `test (macos-latest)`, and `wasm`. Auto-merge has to be allowed on the repository.
# An optional `RELEASE_TOKEN` secret (a personal access token or a GitHub App token
# with contents and pull requests) opens the pull request as that account, so the
# checks start without an approval click and the merge itself triggers `push`.
#
# Action `build` packages the current main without opening a pull request, and
# publishes only when that version has no tag yet.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: prepare opens the release pull request; build packages current main
        type: choice
        default: prepare
        options:
          - prepare
          - build
      bump:
        description: Used when action is prepare
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# Read-only by default; opening the pull request and publishing get write access.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.open.outputs.pr }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - id: bump
        run: .github/scripts/prepare-release.sh "${{ inputs.bump }}"
      - id: open
        env:
          # A token other than GITHUB_TOKEN lets the pull request's checks start
          # without approval and lets the merge trigger push workflows.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          branch="release/v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # index.html carries the same version the sidebar shows.
          git add Cargo.toml Cargo.lock CHANGELOG.md site/app/index.html
          git commit -m "Release v$version"
          git push origin "HEAD:$branch"
          {
            echo "Bumps the version and records the changelog."
            echo
            echo "Auto-merge is enabled. After the required checks pass, this merges and the Release workflow tags \`v$version\` and publishes it."
            echo
            cat CHANGELOG.md
          } > /tmp/release-pr-body.md
          url="$(gh pr create --base main --head "$branch" --title "Release v$version" --body-file /tmp/release-pr-body.md)"
          echo "pr=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"
          if ! gh pr merge --auto --squash "$url"; then
            echo "Could not enable auto-merge. Allow auto-merge on the repository, require the CI checks on main, then enable auto-merge on this pull request."
            exit 1
          fi

  # prepare's merge is often done by GITHUB_TOKEN, which does not start a push
  # workflow. Wait here, then tag and publish from this run.
  wait:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.merged.outputs.sha }}
    steps:
      - id: merged
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            state="$(gh pr view "$PR" --json state --jq .state)"
            echo "pull request state: $state"
            if [[ "$state" == "MERGED" ]]; then
              sha="$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "merged as $sha"
              exit 0
            fi
            if [[ "$state" == "CLOSED" ]]; then
              echo "The release pull request was closed without merging."
              exit 1
            fi
            sleep 60
          done
          echo "Timed out waiting for the release pull request to merge. If it merges later, run this workflow with action build to publish the untagged version."
          exit 1

  check:
    needs: wait
    if: >-
      always() &&
      (
        needs.wait.result == 'success' ||
        (needs.wait.result == 'skipped' && github.event_name == 'push') ||
        (needs.wait.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.action == 'build')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      web_catchup: ${{ steps.version.outputs.web_catchup }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.wait.outputs.sha || github.sha }}
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${{ needs.wait.outputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"
          release=true
          web_catchup=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released."
            release=false
            live="$(curl -fsS --max-time 20 https://app.omacus.com/version.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
            if [ -n "$live" ] && [ "$live" != "$version" ]; then
              echo "app.omacus.com is $live, so this version still needs to go out."
              web_catchup=true
            fi
          else
            echo "v$version is new: releasing."
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "web_catchup=$web_catchup" >> "$GITHUB_OUTPUT"

  # always(): on a push, prepare and wait are skipped. Without always(), GitHub
  # skips every later job too, even after check decides this version is new.
  ci:
    needs: check
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  linux:
    needs: [ci, check]
    if: always() && needs.ci.result == 'success' && needs.check.result == 'success'
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distros
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - run: cargo build --release --locked
      - name: Package .tar.gz
        run: |
          mkdir -p dist/omacus
          cp target/release/omacus assets/omacus.desktop assets/icon-256.png assets/icon.svg install.sh README.md dist/omacus/
          tar -C dist -czf omacus-linux-x86_64.tar.gz omacus
      - name: Package .deb and .rpm
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
          cargo deb --no-build --no-strip --output omacus-linux-x86_64.deb
          cargo generate-rpm --output omacus-linux-x86_64.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            omacus-linux-x86_64.*
            install.sh

  windows:
    needs: [ci, check]
    if: always() && needs.ci.result == 'success' && needs.check.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked
      # Builds the setup .exe and checks it (and the .exe) the way people use them.
      - name: Installer, checked
        shell: pwsh
        run: tests/windows-installer.ps1 target/release/omacus.exe
      - name: Package .zip and the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/omacus.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath omacus-windows-x86_64.zip
          Copy-Item target/installer/omacus-windows-x86_64-setup.exe .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: |
            omacus-windows-x86_64.zip
            omacus-windows-x86_64-setup.exe

  macos:
    needs: [ci, check]
    if: always() && needs.ci.result == 'success' && needs.check.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build for Apple Silicon and Intel
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle Omacus.app and a .dmg for each chip
        # One .dmg per chip rather than a universal one: each download is half the size.
        # Compiling cargo-bundle has taken about 17 minutes. The disk images
        # themselves finished in under a minute. Without a limit, a stuck
        # hdiutil holds the runner until its six-hour cap.
        timeout-minutes: 40
        run: |
          cargo install cargo-bundle --version 0.12.0 --locked
          python3 -m pip install --break-system-packages dmgbuild==1.6.5
          tiffutil -cathidpicheck installer/dmg-background.png installer/dmg-background@2x.png -out installer/dmg-background.tiff
          cargo bundle --release
          for arch in arm64:aarch64 x86_64:x86_64; do
            name="${arch%%:*}" target="${arch#*:}-apple-darwin"
            rm -rf "dmg-$name" && mkdir "dmg-$name"
            cp -R target/release/bundle/osx/Omacus.app "dmg-$name/"
            cp "target/$target/release/omacus" "dmg-$name/Omacus.app/Contents/MacOS/omacus"
            codesign --force --deep --sign - "dmg-$name/Omacus.app"   # ad-hoc; not notarized
            # A window with the app, Applications and an arrow between (installer/dmg-settings.py).
            # dmgbuild calls hdiutil. A stuck image is stopped and tried once more.
            .github/scripts/dmg-retry.sh 180 dmgbuild -s installer/dmg-settings.py -D app="dmg-$name/Omacus.app" Omacus "omacus-macos-$name.dmg"
          done
      - name: Check each .dmg holds a working app for its chip
        # Before anything is published: right architecture, and it runs (Intel via Rosetta).
        timeout-minutes: 10
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for name in arm64 x86_64; do
            mnt="$RUNNER_TEMP/mnt-$name"
            .github/scripts/dmg-retry.sh 60 hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mnt" "omacus-macos-$name.dmg"
            bin="$mnt/Omacus.app/Contents/MacOS/omacus"
            [[ "$(lipo -archs "$bin")" == "$name" ]] || { echo "omacus-macos-$name.dmg holds $(lipo -archs "$bin")"; exit 1; }
            if [[ "$name" == x86_64 ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              softwareupdate --install-rosetta --agree-to-license >/dev/null
            fi
            out="$(arch "-$name" "$bin" --version)"
            echo "$name: $out"
            [[ "$out" == "omacus $version" ]]
            # omacus:// share links open the app.
            scheme="$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$mnt/Omacus.app/Contents/Info.plist")"
            [[ "$scheme" == omacus ]] || { echo "Info.plist has no omacus:// scheme"; exit 1; }
            .github/scripts/dmg-retry.sh 60 hdiutil detach -quiet "$mnt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: omacus-macos-*.dmg

  publish:
    needs: [check, linux, windows, macos]
    # The signing key is a secret on the `release` environment, not a plain
    # repo secret. That environment has no required reviewer. Deploys from it
    # are limited to main and v* tags.
    environment: release
    permissions:
      contents: write
    if: >-
      always() &&
      needs.check.outputs.release == 'true' &&
      needs.linux.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag is pushed from this job. contents: write is enough for that;
          # the Releases API is not, once main has moved. See "Point the tag".
          persist-credentials: true
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0 # tags and history for the release notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        id: notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum omacus-* install.sh > SHA256SUMS.txt)
          .github/scripts/release-notes.sh "${{ needs.check.outputs.version }}" "${{ github.repository }}" > notes.md
          title="$(python3 .github/scripts/release_notes.py headline "${{ needs.check.outputs.version }}")"
          {
            echo "title<<ENDTITLE"
            echo "$title"
            echo "ENDTITLE"
          } >> "$GITHUB_OUTPUT"
          cat notes.md
      - name: Sign the update manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${MINISIGN_SECRET_KEY}" ]]; then
            echo "MINISIGN_SECRET_KEY is not set. Refusing to publish an unsigned update."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          files = {}
          for line in Path("dist/SHA256SUMS.txt").read_text().splitlines():
              line = line.strip()
              if not line:
                  continue
              digest, name = line.split(None, 1)
              name = name.lstrip("*").strip()
              if name in {"omacus-update.json", "SHA256SUMS.txt"} or name.endswith(".minisig"):
                  raise SystemExit(f"{name} must not be inside the signed manifest")
              files[name] = digest
          Path("dist/omacus-update.json").write_text(
              json.dumps({"version": os.environ["VERSION"], "files": files}, indent=2) + "\n"
          )
          PY
          node scripts/sign-update.mjs dist/omacus-update.json
          test -s dist/omacus-update.json.minisig
      - name: Point the tag at the built commit
        # Creating the release with target_commitish asks the Releases API to
        # make the tag. If main has moved and a workflow file differs, that
        # call demands workflows:write, which GITHUB_TOKEN cannot be granted,
        # and the API answers 403. A tag push of a commit already on main does
        # not, and contents: write covers it. Once the tag exists, the release
        # step attaches to it and leaves target_commitish unused.
        # The v* ruleset allows creating a tag and blocks updating or deleting
        # one. This push uses the job token from the checkout. A missing
        # RELEASE_TOKEN does not stop the tag.
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          sha="${{ needs.check.outputs.sha }}"
          git fetch origin "refs/tags/v${version}:refs/tags/v${version}" || true
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            existing="$(git rev-parse "refs/tags/v${version}^{}")"
            if [[ "$existing" != "$sha" ]]; then
              echo "v${version} already points at ${existing}, not ${sha}"
              exit 1
            fi
            echo "v${version} already points at the built commit."
          else
            git tag "v${version}" "$sha"
            git push origin "refs/tags/v${version}"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          # Unused when the tag already exists. Kept so a re-run still names
          # the commit this job built, not whatever main has become.
          target_commitish: ${{ needs.check.outputs.sha }}
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: dist/*

  install-test:
    needs: [publish, check]
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/install-test.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  # A merge made with GITHUB_TOKEN does not start the site workflow. Deploy from
  # here after the tag is published: the prepare/wait path, and a squash merge
  # (wait is skipped on that push; publish is what matters). A normal push to
  # main still deploys through site.yml on its own, without waiting for a tag
  # that does not exist yet.
  deploy-site:
    needs: [publish, wait, check]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      (needs.wait.result == 'success' || needs.check.outputs.release == 'true')
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.wait.outputs.sha || needs.check.outputs.sha }}
      expect_version: ${{ needs.check.outputs.version }}
    permissions:
      contents: read
      pages: write
      id-token: write

  # The web app ships in this same run, as the same version and tag as the
  # desktop app. It uses the app environment for CLOUDFLARE_API_TOKEN. A push
  # to main does not deploy it once app.omacus.com already shows this version.
  # If the tag exists and the live app is still older, publish the web app
  # without tagging again. app.yml is only a way to retry this job.
  deploy-app:
    needs: [publish, check]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (
        (needs.publish.result == 'success' && needs.check.outputs.release == 'true') ||
        needs.check.outputs.web_catchup == 'true'
      )
    runs-on: ubuntu-latest
    environment: app
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECT_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/deploy-app
        with:
          expect_version: ${{ needs.check.outputs.version }}

  # The sync worker is the same commit as the desktop app. A bare deploy from
  # relay/worker publishes omacus-sync. There is no second environment.
  deploy-sync:
    needs: [publish, check]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (
        (needs.publish.result == 'success' && needs.check.outputs.release == 'true') ||
        needs.check.outputs.web_catchup == 'true'
      )
    uses: ./.github/workflows/sync.yml
    secrets: inherit
