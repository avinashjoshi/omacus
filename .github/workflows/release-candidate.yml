name: Release candidate

# A branch with a new version can prepare packages while production deploys.
# This workflow has no production environments, signing secrets, or write token.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.version.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          tags="$(git ls-remote --tags origin "refs/tags/v$version")"
          if [[ -z "$tags" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.sha }}
