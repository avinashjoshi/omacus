name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this first, so nothing ships without passing tests.
  workflow_call:
    inputs:
      ref:
        description: Commit to test. Defaults to the workflow's SHA.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    # The slowest recent green run was 21 minutes, on macOS.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Updates page
        if: runner.os == 'Linux'
        run: python3 site/tools/test_updates.py
      - name: Story page
        if: runner.os == 'Linux'
        run: python3 site/tools/test_story.py
      - name: Release notes
        if: runner.os == 'Linux'
        run: python3 tests/check_release_notes.py && python3 tests/check_versions.py && python3 tests/check_release_workflow.py && python3 tests/check_dmg_retry.py && python3 tests/check_update_signature.py && python3 tests/check_site_pages.py && python3 tests/check_sync_health.py && python3 tests/check_security_review.py && python3 tests/check_ci_browser.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - name: Design tokens
        if: runner.os == 'Linux'
        run: python3 tests/check_design.py && python3 tests/check_sync_devices.py
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Answers checked against exact maths and unit definitions, not fend.
      - name: Accuracy
        if: runner.os == 'Linux'
        run: cargo build --locked && python3 engine/tests/accuracy.py target/debug/omacus
      # install.sh refuses a download that doesn't match the release's checksum, and says so.
      - name: Installer download check
        if: runner.os != 'Windows'
        run: tests/install-fetch.sh
      # omacus.exe runs without the Visual C++ runtime, and the setup and one-liner
      # install, update and uninstall it.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          tests/windows-installer.ps1 target/debug/omacus.exe
      - name: Keep the Windows installer to try
        if: runner.os == 'Windows' && github.workflow == 'CI' # not when the release runs CI: it publishes every artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-setup-debug
          path: target/installer/omacus-windows-x86_64-setup.exe
      - name: Keep the window's screenshot
        if: always() && runner.os == 'Windows' && github.workflow == 'CI'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-window
          path: ${{ runner.temp }}/omacus-window.png
          if-no-files-found: ignore
      # The .dmg window (layout and background) builds, from a debug app bundle.
      - name: macOS .dmg
        if: runner.os == 'macOS' && github.workflow == 'CI' # the release builds its own
        timeout-minutes: 40
        run: |
          cargo install cargo-bundle --version 0.12.0 --locked
          python3 -m pip install --break-system-packages dmgbuild==1.6.5
          tiffutil -cathidpicheck installer/dmg-background.png installer/dmg-background@2x.png -out installer/dmg-background.tiff
          cargo bundle
          .github/scripts/dmg-retry.sh 180 dmgbuild -s installer/dmg-settings.py -D app=target/debug/bundle/osx/Omacus.app Omacus omacus-macos-debug.dmg
          .github/scripts/dmg-retry.sh 60 hdiutil attach -quiet -nobrowse -readonly -mountpoint mnt omacus-macos-debug.dmg
          ls -la mnt
          test -x mnt/Omacus.app/Contents/MacOS/omacus
          test -L mnt/Applications
          test -f mnt/.DS_Store
          .github/scripts/dmg-retry.sh 60 hdiutil detach -quiet mnt
      - name: Keep the .dmg to try
        if: runner.os == 'macOS' && github.workflow == 'CI' # not when the release runs CI: it publishes every artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-dmg-debug
          path: omacus-macos-debug.dmg

  # The engine also runs in the browser (app.omacus.com), so it must build for
  # WebAssembly: no files, threads or network in it. Playwright (Chromium and
  # WebKit) checks that a reload still opens the app with no connection.
  wasm:
    runs-on: ubuntu-latest
    # A healthy run is about 10 minutes. This stops a hung browser install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy -p omacus-engine -p omacus-web -p omacus-sync-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Web app mobile layout
        run: |
          node tests/folders.mjs
          node tests/lock.mjs
          node tests/migrate.mjs
          node tests/seed.mjs
          node tests/backup.mjs
          node tests/sync-save.mjs
          node tests/sync-settings-tab.mjs
          node tests/library-state.mjs
          node tests/sync-vaults.mjs
          node tests/sync-leader.mjs
          node tests/device-name.mjs
          node tests/sync-link.mjs
          node tests/preview-server.mjs
          node tests/web-mobile.mjs
          node tests/word-check.mjs
          node --import ./relay/worker/register-cf.mjs relay/worker/live.test.mjs
          node --import ./relay/worker/register-cf.mjs relay/worker/link-limits.test.mjs
          node --import ./relay/worker/register-cf.mjs relay/worker/leave.test.mjs
          node --import ./relay/worker/register-cf.mjs relay/worker/routing.test.mjs
          node --import ./relay/worker/register-cf.mjs relay/worker/admin.test.mjs
      # Chromium and WebKit are already in the Playwright image that matches
      # @playwright/test. Installing them here with --with-deps apt-gets
      # gstreamer from the Ubuntu mirror, which has held this step for an hour.
      - name: Web app offline
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          .github/scripts/build-web.sh --into site
          docker run --rm --init --ipc=host \
            -e CI=true \
            -e HOME=/tmp \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea \
            bash -c 'npm ci && npx playwright test'
          sudo chown -R "$(id -u):$(id -g)" node_modules
