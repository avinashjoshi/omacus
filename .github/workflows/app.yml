name: App

# Deploys the web app to Cloudflare Pages (app.omacus.com). omacus.com itself
# stays on GitHub Pages. Secrets stay in the environment: this file never prints them.
#
# A push to main does not deploy. The Release workflow publishes this same
# commit after it tags the desktop app, using the app environment below.
# workflow_dispatch is only for retrying that deploy.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The job names the environment `app`. There is no required reviewer.
    # Deploys are limited to the branch `main` and tags `v*`.
    environment: app
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/deploy-app
