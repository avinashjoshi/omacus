name: App

# Deploys the web app to Cloudflare Pages (app.omacus.com). omacus.com itself
# stays on GitHub Pages. Secrets stay in the environment: this file never prints them.
#
# A push to main does not deploy. The Release workflow calls this after it
# publishes the tag, from that same commit, so the sidebar version matches
# the desktop release. workflow_dispatch is only for retrying that deploy.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Assemble
        run: |
          set -euo pipefail
          set +x
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          hash="$(.github/scripts/build-web.sh --dist dist)"
          echo "web build hash $hash"
      - name: Record the build hash on the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          hash="$(cat dist/build-hash.txt)"
          version="$(sed -n 's/.*name="omacus-version" content="\([^"]*\)".*/\1/p' dist/index.html | head -1)"
          if ! gh release view "v$version" >/dev/null 2>&1; then
            echo "No release v$version yet. Settings in this build shows the hash."
            exit 0
          fi
          gh release view "v$version" --json body --jq .body > /tmp/notes.md
          if grep -q "$hash" /tmp/notes.md; then
            echo "The release notes already include this hash."
            exit 0
          fi
          python3 - "$hash" <<'PY'
          import pathlib, sys
          digest = sys.argv[1]
          path = pathlib.Path("/tmp/notes.md")
          text = path.read_text()
          block = (
              "\nBuild hash: `" + digest + "`\n\n"
              "Settings shows this hash. This copy matches the release when the two hashes are the same.\n\n"
          )
          marker = "## Install"
          if marker in text:
              text = text.replace(marker, block + marker, 1)
          else:
              text = text.rstrip() + "\n" + block
          path.write_text(text)
          PY
          gh release edit "v$version" --notes-file /tmp/notes.md
      - name: Publish app.omacus.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare credentials are not set on this repository."
            exit 1
          fi
          zone=232a20ef78c41a58eb56f2d7ae03d15d
          project=omacus-app
          cf() {
            local method="$1" path="$2" body="${3:-}"
            local args=(-sS -o /tmp/cf-body.json -w "%{http_code}" -X "$method"
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
              -H "Content-Type: application/json"
              "https://api.cloudflare.com/client/v4${path}")
            if [ -n "$body" ]; then
              curl "${args[@]}" --data "$body"
            else
              curl "${args[@]}"
            fi
          }
          fail() {
            echo "$1"
            jq -c '.errors // empty' /tmp/cf-body.json || true
            exit 1
          }
          code="$(cf POST "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" '{"name":"omacus-app","production_branch":"main"}')"
          if [ "$code" != "200" ]; then
            if ! jq -e '.errors[]? | .message | test("already|duplicate";"i")' /tmp/cf-body.json >/dev/null; then
              fail "Could not create the Pages project (HTTP ${code})"
            fi
            echo "Pages project already exists"
          fi
          code="$(cf GET "/zones/${zone}/dns_records?type=CNAME&name=app.omacus.com")"
          [ "$code" = "200" ] || fail "Could not read DNS (HTTP ${code})"
          id="$(jq -r '.result[0].id // empty' /tmp/cf-body.json)"
          content="$(jq -r '.result[0].content // empty' /tmp/cf-body.json)"
          proxied="$(jq -r '.result[0].proxied // false' /tmp/cf-body.json)"
          record='{"type":"CNAME","name":"app","content":"omacus-app.pages.dev","proxied":true,"ttl":1}'
          if [ -z "$id" ]; then
            code="$(cf POST "/zones/${zone}/dns_records" "$record")"
            [ "$code" = "200" ] || fail "Could not create the DNS record (HTTP ${code})"
          elif [ "$content" != "omacus-app.pages.dev" ] || [ "$proxied" != "true" ]; then
            code="$(cf PATCH "/zones/${zone}/dns_records/${id}" "$record")"
            [ "$code" = "200" ] || fail "Could not update the DNS record (HTTP ${code})"
          else
            echo "DNS record already points at the Pages project"
          fi
          code="$(cf POST "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains" '{"name":"app.omacus.com"}')"
          if [ "$code" != "200" ]; then
            if ! jq -e '.errors[]? | .message | test("already|exists";"i")' /tmp/cf-body.json >/dev/null; then
              fail "Could not attach app.omacus.com (HTTP ${code})"
            fi
            echo "Custom domain already attached"
          fi
          npm install --no-save wrangler@4
          npx wrangler pages deploy dist --project-name "$project" --branch main --commit-dirty=true
