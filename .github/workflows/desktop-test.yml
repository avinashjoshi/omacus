name: Desktop test

# An unsigned Mac app for trying sync against sync-test.omacus.com.
# It is a prerelease, not a release of Omacus. Desktop sync in the real app
# stays a later version. This workflow does not run on main.

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/phase-2-relay-29c8
    paths:
      - "relay/desktop-test/**"
      - ".github/workflows/desktop-test.yml"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Build omacus Test
        run: bash relay/desktop-test/build-mac.sh
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete omacus-test-desktop --yes --cleanup-tag || true
          gh release create omacus-test-desktop relay/desktop-test/dist/omacus-test-mac.zip \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "omacus Test (not a release)" \
            --notes-file relay/desktop-test/NOTES.txt
