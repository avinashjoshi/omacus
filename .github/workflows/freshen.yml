name: Freshen site

# Once a month, recalculate every example on omacus.com with the real engine, so
# exchange rates and daylight-saving answers stay current, and redeploy if
# anything changed.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - run: cargo build --release --locked
      - run: python3 site/tools/gen.py
      - id: commit
        name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Examples are current."
            echo changed=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Refresh website examples"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo changed=true >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN doesn't start other workflows, so deploy here.
  deploy:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    uses: ./.github/workflows/site.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
