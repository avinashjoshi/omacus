name: Bug report
description: Something gives a wrong answer, crashes, or doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: For a wrong answer, paste the exact line you typed and what Omacus showed.
      placeholder: |
        I typed:   3pm PST in IST
        I got:     …
        Expected:  …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Only needed if it isn't obvious from the above.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Omarchy
        - Other Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Omacus version
      description: From the release you installed, e.g. v0.1.0
      placeholder: v0.1.0
