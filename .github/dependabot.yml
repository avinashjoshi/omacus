# Keeps the pinned GitHub Actions (and Rust crates) up to date with pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site/tools/editor
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /video
    schedule:
      interval: weekly
