# Windows: link the C runtime into omacus.exe. Without this the .exe needs
# VCRUNTIME140.dll, which a fresh Windows install doesn't have ("The code execution
# cannot proceed because VCRUNTIME140.dll was not found"). CI checks for it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
