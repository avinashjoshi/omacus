[package]
name = "omacus"
version = "0.1.0"
edition = "2024"
description = "A notepad calculator: units, currencies, time zones and plain words"
keywords = ["calculator", "numi", "notepad", "units", "currency"]
categories = ["mathematics", "gui"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
fend-core = "1.5.8"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# `cargo deb` -> .deb for Ubuntu/Debian
[package.metadata.deb]
section = "utils"
assets = [
    ["target/release/omacus", "usr/bin/", "755"],
    ["assets/omacus.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/omacus.png", "644"],
]

# `cargo bundle` -> Omacus.app for macOS
[package.metadata.bundle]
name = "Omacus"
identifier = "dev.omacus.Omacus"
icon = ["assets/icon-256.png", "assets/icon-512.png"]
category = "public.app-category.productivity"
short_description = "A notepad calculator"
