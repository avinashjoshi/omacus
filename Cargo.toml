[workspace]
members = ["engine", "web"]

[package]
name = "omacus"
version = "0.1.21"
edition = "2024"
license = "MIT"
authors = ["Avinash Joshi <avinash@hey.com>"]
description = "A notepad calculator: units, currencies, time zones and plain words"
keywords = ["calculator", "notepad", "units", "currency", "omarchy"]
categories = ["mathematics", "gui"]
repository = "https://github.com/avinashjoshi/omacus"
homepage = "https://github.com/avinashjoshi/omacus"

[dependencies]
omacus-engine = { path = "engine" }
dirs = "7.0.0"
# The renderer is chosen per target below. glow (OpenGL) is not listed here:
# a Windows dependency line adds to this one, and would still compile glow in.
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11", "clipboard", "links"] }
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
toml = "1.1.8"
ureq = "3.4.2"

[build-dependencies]
miniz_oxide = "0.8"

# The icon and version details in omacus.exe (Explorer, the taskbar, Start).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# OpenGL everywhere except Windows, which uses Direct3D 12 (below).
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }

# Share links clicked on macOS arrive as an Apple Event (see src/links.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSString", "objc2-core-services"] }

[target.'cfg(windows)'.dependencies]
# Direct3D 12 on Windows: OpenGL 2 is often missing there (virtual machines,
# Remote Desktop, no GPU driver), and D3D falls back to Windows' own software
# renderer when there's no GPU. glow is not enabled, so that OpenGL backend
# is not compiled into the Windows binary.
eframe = { version = "0.37.0", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
# Updates on Windows arrive as the release .zip.
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
# Whole-program optimisation: about 1.5 MB smaller than "thin", and just as fast.
# (opt-level "s" would save 2.5 MB more but makes typing ~40% slower; not worth it.)
lto = "fat"
codegen-units = 1

# `cargo deb` -> .deb for Ubuntu/Debian
[package.metadata.deb]
section = "utils"
maintainer = "Avinash Joshi <avinash@hey.com>"
extended-description = """\
Type on the left, results appear on the right. Understands units, currencies, \
percentages, variables, totals, dates and time zones, with multiple sheets that \
save as you type."""
assets = [
    ["target/release/omacus", "usr/bin/", "755"],
    ["assets/omacus.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/omacus.png", "644"],
]

# `cargo bundle` -> Omacus.app for macOS
[package.metadata.bundle]
name = "Omacus"
identifier = "dev.omacus.Omacus"
icon = ["assets/icon-256.png", "assets/icon-512.png"]
category = "public.app-category.productivity"
short_description = "A notepad calculator"

# omacus:// share links open the app.
[package.metadata.bundle.osx]
url_schemes = ["omacus"]

# `cargo generate-rpm` -> .rpm for Fedora/openSUSE
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/omacus", dest = "/usr/bin/omacus", mode = "755" },
    { source = "assets/omacus.desktop", dest = "/usr/share/applications/omacus.desktop", mode = "644" },
    { source = "assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/omacus.png", mode = "644" },
]

# `./install.sh` from a source checkout: about as fast, a few MB bigger, and built in
# a fraction of the time (the release profile's whole-program pass is for downloads).
[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
