[package]
name = "omacus-web"
version.workspace = true
edition = "2024"
description = "The Omacus engine for the browser (app.omacus.com)"
license = "MIT"
publish = false  # internal; the version is the workspace version in ../Cargo.toml

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
omacus-engine = { path = "../engine" }
omacus-doc = { path = "../doc" }
# Pinned exactly: the generated JS glue must match the wasm-bindgen CLI version.
wasm-bindgen = "=0.2.129"
serde_json = "1.0.154"
