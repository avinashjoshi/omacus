[package]
name = "omacus-engine"
version = "0.0.0"
edition = "2024"
description = "The Omacus math engine: notepad conventions on top of fend, dates, time zones and more"
license = "MIT"
publish = false  # internal; the app's version is the one in ../Cargo.toml

# Pure computation, no files, network or UI, so the same code runs in the desktop
# app and, compiled to WebAssembly, in the browser.
[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
chrono-tz = "0.10.4"
ed25519-dalek = "3.0.0"
fend-core = "1.5.8"
getrandom = "0.2"
hkdf = "0.13.0"
miniz_oxide = "0.8"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
sha2 = "0.11.1"
# `static_secrets` so a device receive key can be built from our own random
# bytes. The crate's `getrandom` feature calls a newer getrandom than this
# crate uses, so keys are filled with getrandom 0.2 and loaded with `From`.
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

# `getrandom` on wasm32 needs the browser's crypto. The feature is target-gated
# so the desktop build does not pull in wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
